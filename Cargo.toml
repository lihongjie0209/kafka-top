[package]
name = "kafka-top"
version = "0.1.0"
edition = "2021"
description = "Kafka cluster monitoring TUI"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rdkafka = { version = "0.38", default-features = false, features = [
    "cmake-build",
    "static-linking",
    "tokio",
    "zstd",
] }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
