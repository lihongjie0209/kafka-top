name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
            name: kafka-top-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
            name: kafka-top-aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build x86_64 in CentOS 7 container (glibc 2.17)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm -v "$PWD:/build" -w /build centos:7 bash -c '
            set -e
            # Switch to vault repos (CentOS 7 is EOL)
            sed -i "s|mirror.centos.org|vault.centos.org|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|#baseurl=http|baseurl=http|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|mirrorlist=http|#mirrorlist=http|g" /etc/yum.repos.d/CentOS-Base.repo
            # Install EPEL and SCL repos
            yum install -y epel-release centos-release-scl
            # Fix all repo files (incl. newly installed SCL/EPEL) to use vault
            sed -i "s|mirror.centos.org|vault.centos.org|g" /etc/yum.repos.d/*.repo
            sed -i "s|#baseurl=http|baseurl=http|g" /etc/yum.repos.d/*.repo
            sed -i "s|^mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/*.repo
            yum clean all
            # Install build dependencies (disable broken SCL repos)
            yum install -y --disablerepo=centos-sclo-sclo devtoolset-9-gcc devtoolset-9-gcc-c++ cmake3 libcurl-devel openssl-devel pkgconfig git clang clang-libs
            ln -sf /usr/bin/cmake3 /usr/bin/cmake
            # Install Rust
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -q
            . $HOME/.cargo/env
            # Use modern GCC from SCL (already installed from cache)
            source /opt/rh/devtoolset-9/enable
            rustup target add x86_64-unknown-linux-gnu
            cargo build --release --target x86_64-unknown-linux-gnu
            cd target/x86_64-unknown-linux-gnu/release
            tar czf /build/kafka-top-x86_64-linux.tar.gz kafka-top
          '

      - name: Build aarch64 in Rocky Linux 8 container (glibc 2.28)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm -v "$PWD:/build" -w /build arm64v8/rockylinux:8 bash -c '
            set -e
            dnf install -y gcc gcc-c++ cmake libcurl-devel openssl-devel pkgconfig git clang
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -q
            . $HOME/.cargo/env
            rustup target add aarch64-unknown-linux-gnu
            cargo build --release --target aarch64-unknown-linux-gnu
            cd target/aarch64-unknown-linux-gnu/release
            tar czf /build/kafka-top-aarch64-linux.tar.gz kafka-top
          '

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          generate_release_notes: true

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            name: kafka-top-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            name: kafka-top-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            name: kafka-top-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
