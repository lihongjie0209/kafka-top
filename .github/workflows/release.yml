name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
            name: kafka-top-x86_64-linux

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ""
            name: kafka-top-aarch64-linux

          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            name: kafka-top-x86_64-macos

          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            name: kafka-top-aarch64-macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            name: kafka-top-x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # For Docker-based musl builds: use rust:alpine (musl native)
      - name: Build (musl Docker)
        if: contains(matrix.target, 'linux-musl')
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            rust:alpine sh -c "
              apk add --no-cache musl-dev cmake make g++ curl-dev openssl-dev perl zstd-dev pkgconfig &&
              ZSTD_SYS_USE_PKG_CONFIG=1 cargo build --release --target ${{ matrix.target }}
            "

      # For non-musl targets: use host toolchain
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(matrix.target, 'linux-musl') }}
        with:
          targets: ${{ matrix.target }}

      - name: Build (host)
        if: ${{ !contains(matrix.target, 'linux-musl') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          generate_release_notes: true
