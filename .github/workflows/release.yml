name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
            name: kafka-top-x86_64-linux

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
            name: kafka-top-aarch64-linux

          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            name: kafka-top-x86_64-macos

          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            name: kafka-top-aarch64-macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            name: kafka-top-x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          generate_release_notes: true
