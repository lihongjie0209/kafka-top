name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu.2.17
            name: kafka-top-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu.2.17
            name: kafka-top-aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev

      - name: Install zig
        run: |
          ARCH=$(uname -m)
          curl -L "https://ziglang.org/download/0.13.0/zig-linux-${ARCH}-0.13.0.tar.xz" | sudo tar xJ -C /opt
          echo "/opt/zig-linux-${ARCH}-0.13.0" >> $GITHUB_PATH

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.19.6

      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "../../../${{ matrix.name }}.tar.gz" kafka-top

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          generate_release_notes: ${{ matrix.name == 'kafka-top-x86_64-linux' }}

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            name: kafka-top-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            name: kafka-top-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            name: kafka-top-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
