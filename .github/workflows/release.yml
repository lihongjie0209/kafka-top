name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: kafka-top-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: kafka-top-aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS 7 container (glibc 2.17)
        run: |
          docker run --rm -v "$PWD:/build" -w /build centos:7 bash -c '
            set -e
            ARCH=$(uname -m)
            echo "=== Architecture: $ARCH ==="

            # Fix CentOS-Base.repo to vault (CentOS 7 is EOL)
            sed -i "s|mirror.centos.org|vault.centos.org|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|#baseurl=http|baseurl=http|g" /etc/yum.repos.d/CentOS-Base.repo
            sed -i "s|mirrorlist=http|#mirrorlist=http|g" /etc/yum.repos.d/CentOS-Base.repo

            # Install EPEL and SCL repos
            yum install -y epel-release centos-release-scl

            # Fix all repo files (including newly installed SCL/EPEL) to use vault
            sed -i "s|mirror.centos.org|vault.centos.org|g" /etc/yum.repos.d/*.repo
            sed -i "s|#baseurl=http|baseurl=http|g" /etc/yum.repos.d/*.repo
            sed -i "s|^mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/*.repo

            # On aarch64, SCL repos may need altarch path instead of /centos/
            if [ "$ARCH" = "aarch64" ]; then
              echo "=== Fixing SCL repo paths for aarch64 ==="
              sed -i "s|/centos/7/sclo/|/altarch/7/sclo/|g" /etc/yum.repos.d/CentOS-SCLo*.repo 2>/dev/null || true
            fi

            yum clean all

            # Install build dependencies
            # --disablerepo=centos-sclo-sclo avoids the broken community SCL repo
            # llvm-toolset-7-clang provides clang 7.0 (needed for bindgen in zstd-sys)
            # The EPEL clang 3.4.2 is too old for modern bindgen
            yum install -y --disablerepo=centos-sclo-sclo \
              devtoolset-9-gcc devtoolset-9-gcc-c++ \
              llvm-toolset-7-clang \
              cmake3 libcurl-devel openssl-devel pkgconfig git \
              clang libzstd-devel

            ln -sf /usr/bin/cmake3 /usr/bin/cmake

            # Enable devtoolset-9 (modern GCC 9 for compilation)
            source /opt/rh/devtoolset-9/enable

            # Enable LLVM toolset 7 if available (modern clang 7.0 for bindgen)
            # On architectures where it is not available, EPEL clang is installed fallback
            if [ -f /opt/rh/llvm-toolset-7/enable ]; then
              source /opt/rh/llvm-toolset-7/enable
              echo "=== LLVM toolset 7 enabled ==="
            else
              echo "=== LLVM toolset 7 not available, using EPEL clang ==="
            fi

            # Locate libclang for bindgen (zstd-sys needs it)
            echo "=== Locating libclang ==="
            find / -name "libclang*" -type f 2>/dev/null
            export LIBCLANG_PATH=$(find /opt/rh /usr -name "libclang.so" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
            if [ -z "$LIBCLANG_PATH" ]; then
              export LIBCLANG_PATH=$(find /opt/rh /usr -name "libclang.so.*" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
            fi
            echo "LIBCLANG_PATH=$LIBCLANG_PATH"

            echo "=== Compiler versions ==="
            gcc --version | head -1
            g++ --version | head -1
            clang --version | head -1

            # Install Rust
            curl --proto "=https" --tlsv1.2 --retry 5 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable -q
            . "$HOME/.cargo/env"

            rustup target add "$ARCH-unknown-linux-gnu"
            echo "=== Starting cargo build ($ARCH) ==="
            # Use system zstd if available (via pkg-config) to speed up build
            export ZSTD_SYS_USE_PKG_CONFIG=1
            RUST_BACKTRACE=1 cargo build --release --target "$ARCH-unknown-linux-gnu" 2>&1
            echo "=== Build complete ==="

            cd "target/$ARCH-unknown-linux-gnu/release"
            tar czf "/build/${{ matrix.name }}.tar.gz" kafka-top
            echo "=== Package created ==="
          '

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          generate_release_notes: true

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            name: kafka-top-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            name: kafka-top-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            name: kafka-top-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
