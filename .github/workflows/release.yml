name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: kafka-top-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: kafka-top-aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev
          # Verify curl headers are installed
          ls /usr/include/curl/curl.h

      - name: Install zig
        run: |
          ARCH=$(uname -m)
          curl -L "https://ziglang.org/download/0.14.0/zig-linux-${ARCH}-0.14.0.tar.xz" | sudo tar xJ -C /opt
          echo "/opt/zig-linux-${ARCH}-0.14.0" >> $GITHUB_PATH

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build with glibc 2.17 compatibility
        run: |
          # zig cc does not search system include paths by default,
          # so we need to pass them explicitly via CFLAGS
          MULTIARCH_DIR="$(uname -m)-linux-gnu"
          export CFLAGS="-I/usr/include -I/usr/include/${MULTIARCH_DIR}"
          export CXXFLAGS="-I/usr/include -I/usr/include/${MULTIARCH_DIR}"
          GLIBC_TARGET="${{ matrix.target }}.2.17"
          cargo zigbuild --release --target "$GLIBC_TARGET"

      - name: Package
        shell: bash
        run: |
          GLIBC_TARGET="${{ matrix.target }}.2.17"
          cd "target/$GLIBC_TARGET/release"
          tar czf "../../../${{ matrix.name }}.tar.gz" kafka-top

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
          generate_release_notes: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            name: kafka-top-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            name: kafka-top-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            name: kafka-top-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz kafka-top${{ matrix.suffix }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.tar.gz
